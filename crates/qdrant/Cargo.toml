[package]
name = "piil-qdrant"
version = "0.2.1"
edition = "2024"


[dependencies]
anyhow = "1.0"
async-trait = "0.1"
hex = "0.4"
kameo = "0.22"
uuid = { version = "1.27", features = ["v4"] }
qdrant-client = "1.19"
rust-mcp-sdk = { version = "2.0", features = ["stdio", "server"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
